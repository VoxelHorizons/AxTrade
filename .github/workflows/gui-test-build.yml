name: Build AxTrade GUI Test JAR

on:
  push:
    branches: [feature/gui-placeholder-integration]
  pull_request:
  workflow_dispatch:

jobs:
  gui-test-build:
    name: Compile AxTrade GUI test distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare test-only dependency profile
        run: python3 scripts/prepare-gui-test.py
      - name: Build shaded plugin JAR
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Verify plugin.yml inside JAR
        run: |
          jar tf target/AxTrade-*-voxel-gui-test.jar | grep -x plugin.yml
          unzip -p target/AxTrade-*-voxel-gui-test.jar plugin.yml | grep -E '^name: AxTrade$'
      - name: Upload GUI test artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxTrade-GUI-Test-JAR
          path: target/AxTrade-*-voxel-gui-test.jar
          if-no-files-found: error
          retention-days: 14
